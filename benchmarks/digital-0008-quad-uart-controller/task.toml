schema_version = "1.4"
artifacts = ["/app/output/rtl/quad_uart_controller.sv"]

[task]
name = "circuitbench-digital/6046-quad-uart-controller"
description = "Implement a complete four-channel FIFOed 8N1 UART controller and close a 100 MHz GF180MCU physical implementation."

[agent]
timeout_sec = 7200
user = "agent"

[verifier]
timeout_sec = 3600
user = "root"
network_mode = "no-network"

[environment]
os = "linux"
build_timeout_sec = 18000.0
network_mode = "no-network"
cpus = 4
memory_mb = 12288
storage_mb = 30720
pdk = "GF180MCU/gf180mcuD"
