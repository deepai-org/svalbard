schema_version = "1.4"
artifacts = ["/app/output/rtl/ecc_sdram_controller.sv"]

[task]
name = "circuitbench-digital/6047-ecc-sdram-controller"
description = "Implement a 64-bit SECDED controller for a 64 MiB x32 SDR SDRAM and close a 100 MHz GF180MCU physical implementation."

[agent]
timeout_sec = 10800
user = "agent"

[verifier]
timeout_sec = 5400
user = "root"
network_mode = "no-network"

[environment]
os = "linux"
build_timeout_sec = 18000.0
network_mode = "no-network"
cpus = 4
memory_mb = 12288
storage_mb = 30720
pdk = "GF180MCU/gf180mcuD"
