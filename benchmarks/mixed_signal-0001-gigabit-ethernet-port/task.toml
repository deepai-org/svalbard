schema_version = "1.4"
artifacts = [
  "/app/output/rtl/gigabit_ethernet_port_pkg.sv",
  "/app/output/rtl/gigabit_ethernet_port.sv",
  "/app/output/analog/gigabit_ethernet_phy.spice",
  "/app/output/integration/port_manifest.json",
  "/app/output/layout/gigabit_ethernet_port.gds",
]

[task]
name = "circuitbench-mixed-signal/0001-complete-gigabit-ethernet-port"
description = "Implement a complete packet-to-pins 1000BASE-X-style Gigabit Ethernet port with an integrated GF180MCU SerDes PHY."

[agent]
timeout_sec = 172800
user = "agent"

[verifier]
timeout_sec = 43200
user = "root"
network_mode = "no-network"

[environment]
os = "linux"
build_timeout_sec = 18000.0
network_mode = "no-network"
cpus = 16
memory_mb = 49152
storage_mb = 131072
pdk = "GF180MCU/gf180mcuD"
pdk_lock = "pdk.lock.json"
pdk_status = "candidate_not_provider_accepted"
