<text x="702" y="959" font-size="14" font-weight="400">RF I/Q or wired words ↔ packing / gearbox ↔ bounded CDC / elasticity ↔ SDR / DDR capture / launch</text>
<text x="702" y="980" font-size="14" font-weight="400">1,024-bit ingress allocation; bulk payload and fault quarantine remain on FPGA</text>
<text x="702" y="1001" font-size="14" font-weight="400">D2H: active clock or H2D-follow; direct bursts: 100 MHz SDR byte/control/parity</text>
<text x="702" y="1022" font-size="14" font-weight="400">Wired line-rate sampling stays dedicated; RF converters are not serial-lane samplers</text>
</g>
