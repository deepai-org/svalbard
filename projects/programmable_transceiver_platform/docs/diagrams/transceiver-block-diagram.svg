<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1590" viewBox="0 0 1800 1590" role="img" aria-labelledby="title desc"><title id="title">Svalbard normative transceiver architecture</title><desc id="desc">RF west, wired east, timing north, host south. 74 provider sites, 37 functional signals. RF and wired payload operation exclusive. External clock input is one differential REF_IN / REF_IN_N port. Physical performance remains unqualified.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#355269"/></marker></defs><rect width="1800" height="1590" fill="white"/><g font-family="DejaVu Sans,sans-serif" fill="#172a3a">
<text x="30" y="38" font-size="28" font-weight="600">SVALBARD / NORMATIVE ARCHITECTURE</text>
<text x="30" y="67" font-size="17" font-weight="400">Current architecture • review fixes selected; physical performance unqualified</text>
<g data-blocks="">
<rect x="210" y="150" width="1380" height="970" rx="5" fill="#fcfdfe" stroke="#8096a6"/>
<text x="222" y="175" font-size="17" font-weight="600">ONE GF180MCU DIE • RF OR WIRED PAYLOAD • 74 PROVIDER-COMPATIBLE SITES</text>
</g>
<text x="230" y="203" font-size="14" font-weight="400">Functional paths; candidate pads: RF/REF west, wired east, H2D north, D2H/control south. Core budget: 12.92 mm².</text>
