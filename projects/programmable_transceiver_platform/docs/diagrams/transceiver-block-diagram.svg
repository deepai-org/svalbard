<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1590" viewBox="0 0 1800 1590" role="img" aria-labelledby="title desc"><title id="title">Svalbard normative transceiver architecture</title><desc id="desc">RF west, wired east, timing north, host south. Fifty terminals. RF and wired payload operation exclusive. External clock input is an alternate mode of REF_IN. Physical performance remains unqualified.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#355269"/></marker></defs><rect width="1800" height="1590" fill="white"/><g font-family="DejaVu Sans,sans-serif" fill="#172a3a">
<text x="30" y="38" font-size="28" font-weight="600">SVALBARD / NORMATIVE ARCHITECTURE</text>
<text x="30" y="67" font-size="17" font-weight="400">Selected functional boundaries • circuit topology and physical performance remain to be qualified</text>
<rect x="210" y="150" width="1380" height="970" rx="5" fill="#fcfdfe" stroke="#8096a6"/>
<text x="222" y="175" font-size="17" font-weight="600">ONE GF180MCU DIE • RF OR WIRED PAYLOAD • 50 TOTAL TERMINALS</text>
<text x="230" y="203" font-size="14" font-weight="400">Approximate placement neighborhoods; not to scale. 12.92 mm² core allocation includes 2.92 mm² reserve.</text>
<rect x="590" y="85" width="610" height="65" rx="5" fill="#fff6df" stroke="#8096a6"/>
<text x="602" y="110" font-size="17" font-weight="600">REF_IN (1)</text>
<text x="602" y="134" font-size="14" font-weight="400">Alternate external reference / clock / RF LO; no simultaneous inputs</text>
<polyline points="1190,150 1115,150 1115,205 1080,205 1080,220" fill="none" stroke="#8655a2" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)" />
<rect x="700" y="220" width="400" height="110" rx="5" fill="#f1f6fa" stroke="#8096a6"/>
<text x="712" y="245" font-size="17" font-weight="600">Qualified input + stopped source selection</text>
<text x="712" y="269" font-size="14" font-weight="400">Separate RF-capable conditioning branch required</text>
<text x="712" y="290" font-size="14" font-weight="400">Reference → autonomous loop OR clock/LO bypass</text>
<text x="712" y="311" font-size="14" font-weight="400">Input bandwidth, swing and additive noise: open</text>
<rect x="245" y="220" width="405" height="110" rx="5" fill="#f1f6fa" stroke="#8096a6"/>
<text x="257" y="245" font-size="17" font-weight="600">RF synthesis + local quadrature</text>
<text x="257" y="269" font-size="14" font-weight="400">PFD / charge pump / loop filter / tunable VCO</text>
<text x="257" y="290" font-size="14" font-weight="400">External LO bypass → I/Q phase generation</text>
<text x="257" y="311" font-size="14" font-weight="400">Local LO buffers; programmable sample divider</text>
<rect x="1150" y="220" width="405" height="110" rx="5" fill="#f1f6fa" stroke="#8096a6"/>
<text x="1162" y="245" font-size="17" font-weight="600">Wired TX synthesis + phase control</text>
<text x="1162" y="269" font-size="14" font-weight="400">PFD / charge pump / filter / oscillator / divider</text>
<text x="1162" y="290" font-size="14" font-weight="400">External timing or synthesis; flexible ×10 mode</text>
<text x="1162" y="311" font-size="14" font-weight="400">Independent RX CDR remains mandatory</text>
<polyline points="700,266 650,266" fill="none" stroke="#8655a2" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)" />
<polyline points="1100,266 1150,266" fill="none" stroke="#8655a2" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)" />
<text x="250" y="370" font-size="20" font-weight="600">RF RX • differential I/Q branches</text>
<rect x="20" y="412" width="170" height="80" rx="5" fill="#fff6df" stroke="#8096a6"/>
<text x="32" y="437" font-size="17" font-weight="600">RF_RX P/N (2)</text>
<text x="32" y="461" font-size="14" font-weight="400">Board preselection</text>
<text x="32" y="482" font-size="14" font-weight="400">matching / balun</text>
<rect x="245" y="400" width="180" height="95" rx="5" fill="#f1f6fa" stroke="#8096a6"/>
<text x="257" y="425" font-size="17" font-weight="600">Input + LNA</text>
<text x="257" y="449" font-size="14" font-weight="400">Protection / bias</text>
<text x="257" y="470" font-size="14" font-weight="400">Selectable gain</text>
<rect x="460" y="400" width="180" height="95" rx="5" fill="#f1f6fa" stroke="#8096a6"/>
<text x="472" y="425" font-size="17" font-weight="600">I / Q mixers</text>
<text x="472" y="449" font-size="14" font-weight="400">LO-I / LO-Q</text>
<text x="472" y="470" font-size="14" font-weight="400">Separate branches</text>
<rect x="675" y="400" width="200" height="95" rx="5" fill="#f1f6fa" stroke="#8096a6"/>
<text x="687" y="425" font-size="17" font-weight="600">PGA + tunable LPF</text>
<text x="687" y="449" font-size="14" font-weight="400">Offset / common-mode</text>
<text x="687" y="470" font-size="14" font-weight="400">Narrow &amp; wide settings</text>
<rect x="910" y="400" width="180" height="95" rx="5" fill="#f1f6fa" stroke="#8096a6"/>
<text x="922" y="425" font-size="17" font-weight="600">I / Q ADCs</text>
<text x="922" y="449" font-size="14" font-weight="400">Sampling / quantization</text>
<text x="922" y="470" font-size="14" font-weight="400">Buffered references</text>
<polyline points="190,455 245,455" fill="none" stroke="#355269" stroke-width="2" marker-end="url(#a)" />
<polyline points="425,455 460,455" fill="none" stroke="#355269" stroke-width="2" marker-end="url(#a)" />
<polyline points="640,455 675,455" fill="none" stroke="#355269" stroke-width="2" marker-end="url(#a)" />
<polyline points="875,455 910,455" fill="none" stroke="#355269" stroke-width="2" marker-end="url(#a)" />
<text x="700" y="355" font-size="14" font-weight="400">LO-I / LO-Q → local RX and TX mixer ports</text>
<polyline points="550,385 550,400" fill="none" stroke="#8655a2" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)" />
<text x="250" y="540" font-size="20" font-weight="600">RF TX • differential I/Q branches</text>
<rect x="20" y="572" width="170" height="95" rx="5" fill="#fff6df" stroke="#8096a6"/>
<text x="32" y="597" font-size="17" font-weight="600">RF_TX P/N (2)</text>
<text x="32" y="621" font-size="14" font-weight="400">Board matching / filter</text>
<text x="32" y="642" font-size="14" font-weight="400">External PA as needed</text>
<rect x="245" y="565" width="180" height="95" rx="5" fill="#f1f6fa" stroke="#8096a6"/>
<text x="257" y="590" font-size="17" font-weight="600">RF output driver</text>
<text x="257" y="614" font-size="14" font-weight="400">Gain / bias / headroom</text>
<text x="257" y="635" font-size="14" font-weight="400">Summed I/Q output</text>
<rect x="460" y="565" width="180" height="95" rx="5" fill="#f1f6fa" stroke="#8096a6"/>
<text x="472" y="590" font-size="17" font-weight="600">I / Q upmixers</text>
<text x="472" y="614" font-size="14" font-weight="400">LO-I / LO-Q</text>
<text x="472" y="635" font-size="14" font-weight="400">Local summation</text>
<rect x="675" y="565" width="200" height="95" rx="5" fill="#f1f6fa" stroke="#8096a6"/>
<text x="687" y="590" font-size="17" font-weight="600">Reconstruction LPF</text>
<text x="687" y="614" font-size="14" font-weight="400">Selectable cutoff / gain</text>
<text x="687" y="635" font-size="14" font-weight="400">Order not yet frozen</text>
<rect x="910" y="565" width="180" height="95" rx="5" fill="#f1f6fa" stroke="#8096a6"/>
<text x="922" y="590" font-size="17" font-weight="600">I / Q DACs</text>
<text x="922" y="614" font-size="14" font-weight="400">Registered update</text>
<text x="922" y="635" font-size="14" font-weight="400">Buffered references</text>
<polyline points="245,615 190,615" fill="none" stroke="#355269" stroke-width="2" marker-end="url(#a)" />
<polyline points="460,615 425,615" fill="none" stroke="#355269" stroke-width="2" marker-end="url(#a)" />
<polyline points="675,615 640,615" fill="none" stroke="#355269" stroke-width="2" marker-end="url(#a)" />
<polyline points="910,615 875,615" fill="none" stroke="#355269" stroke-width="2" marker-end="url(#a)" />
<polyline points="550,550 550,565" fill="none" stroke="#8655a2" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)" />
<rect x="1140" y="385" width="410" height="120" rx="5" fill="#f1f6fa" stroke="#8096a6"/>
<text x="1152" y="410" font-size="17" font-weight="600">Wired RX / shared USB pair</text>
<text x="1152" y="434" font-size="14" font-weight="400">Protection / switchable termination / common mode</text>
<text x="1152" y="455" font-size="14" font-weight="400">Serial CTLE → slicers → phase sampler / RX CDR</text>
<text x="1152" y="476" font-size="14" font-weight="400">Deserializer / alignment → RX words</text>
<text x="1152" y="497" font-size="14" font-weight="400">USB HS + FS/LS receiver, squelch and line states</text>
<rect x="1610" y="405" width="175" height="100" rx="5" fill="#fff6df" stroke="#8096a6"/>
<text x="1622" y="430" font-size="17" font-weight="600">WIRE_RX P/N (2)</text>
<text x="1622" y="454" font-size="14" font-weight="400">USB D+ / D− alias</text>
<text x="1622" y="475" font-size="14" font-weight="400">Bidirectional in USB</text>
<polyline points="1610,455 1550,455" fill="none" stroke="#355269" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>
<rect x="1140" y="550" width="410" height="130" rx="5" fill="#f1f6fa" stroke="#8096a6"/>
<text x="1152" y="575" font-size="17" font-weight="600">Wired TX / specialized pad branches</text>
<text x="1152" y="599" font-size="14" font-weight="400">TX words → serializer → main / postcursor driver</text>
<text x="1152" y="620" font-size="14" font-weight="400">Serial idle / load detect; DC TMDS pad mode</text>
<text x="1152" y="641" font-size="14" font-weight="400">USB HS + FS/LS drive / pulls → WIRE_RX pair</text>
<text x="1152" y="662" font-size="14" font-weight="400">WIRE_TX high impedance during USB operation</text>
<rect x="1610" y="570" width="175" height="85" rx="5" fill="#fff6df" stroke="#8096a6"/>
<text x="1622" y="595" font-size="17" font-weight="600">WIRE_TX P/N (2)</text>
<text x="1622" y="619" font-size="14" font-weight="400">Serial / TMDS</text>
<text x="1622" y="640" font-size="14" font-weight="400">Board termination</text>
<polyline points="1550,615 1610,615" fill="none" stroke="#355269" stroke-width="2" marker-end="url(#a)" />
<polyline points="1515,550 1570,550 1570,485 1550,485" fill="none" stroke="#355269" stroke-width="2" marker-end="url(#a)" />
<polyline points="1360,330 1360,360 1120,360 1120,585 1140,585" fill="none" stroke="#8655a2" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)" />
<rect x="245" y="715" width="410" height="130" rx="5" fill="#fff8e9" stroke="#8096a6"/>
<text x="257" y="740" font-size="17" font-weight="600">Shared bias / converter reference services</text>
<text x="257" y="764" font-size="14" font-weight="400">Startup → V/I reference → error amp + source/sink buffer</text>
<text x="257" y="785" font-size="14" font-weight="400">Local reservoirs, isolation and trim; replicas as needed</text>
<text x="257" y="806" font-size="14" font-weight="400">Share slow services where loading permits</text>
<text x="257" y="827" font-size="14" font-weight="400">No universal GHz analog crossbar</text>
<rect x="690" y="715" width="400" height="130" rx="5" fill="#f7f0fa" stroke="#8096a6"/>
<text x="702" y="740" font-size="17" font-weight="600">Clock, configuration and observation</text>
<text x="702" y="764" font-size="14" font-weight="400">LO dividers → ADC/DAC timing and RF D2H clock</text>
<text x="702" y="785" font-size="14" font-weight="400">Stop / select / settle / train / run; lock-loss recovery</text>
<text x="702" y="806" font-size="14" font-weight="400">SPI trims, bounded status and existing stream capture</text>
<text x="702" y="827" font-size="14" font-weight="400">Panel-local clock / bias / control fanout</text>
<rect x="1610" y="745" width="175" height="85" rx="5" fill="#fff6df" stroke="#8096a6"/>
<text x="1622" y="770" font-size="17" font-weight="600">PWR / GND (14)</text>
<text x="1622" y="794" font-size="14" font-weight="400">7 supply / return pairs</text>
<text x="1622" y="815" font-size="14" font-weight="400">Board regulation</text>
<polyline points="1610,790 1550,790" fill="none" stroke="#355269" stroke-width="2" marker-end="url(#a)" />
<rect x="1140" y="715" width="410" height="130" rx="5" fill="#fff8e9" stroke="#8096a6"/>
<text x="1152" y="740" font-size="17" font-weight="600">Supply / return distribution</text>
<text x="1152" y="764" font-size="14" font-weight="400">CORE ×1, HOST ×2, WIRE ×2, RF ×1, PLL ×1 pairs</text>
<text x="1152" y="785" font-size="14" font-weight="400">External regulation / decoupling / damping allowed</text>
<text x="1152" y="806" font-size="14" font-weight="400">Local isolation and filtering; regulators not frozen</text>
<text x="1152" y="827" font-size="14" font-weight="400">Host harmonics and package coupling remain risks</text>
<polyline points="1000,495 1105,495 1105,885 900,885 900,910" fill="none" stroke="#355269" stroke-width="2" marker-end="url(#a)" />
<polyline points="870,910 870,865 1115,865 1115,645 1090,645" fill="none" stroke="#355269" stroke-width="2" marker-end="url(#a)" />
<polyline points="1200,505 1128,505 1128,880 1250,880 1250,910" fill="none" stroke="#355269" stroke-width="2" marker-end="url(#a)" />
<polyline points="1290,910 1290,890 1565,890 1565,695 1200,695 1200,680" fill="none" stroke="#355269" stroke-width="2" marker-end="url(#a)" />
<rect x="245" y="910" width="410" height="125" rx="5" fill="#f1f6fa" stroke="#8096a6"/>
<text x="257" y="935" font-size="17" font-weight="600">SPI / reset / resource ownership</text>
<text x="257" y="959" font-size="14" font-weight="400">Generic numeric controls; no chip protocol profiles</text>
<text x="257" y="980" font-size="14" font-weight="400">Atomic configuration; inactive payload isolated</text>
<text x="257" y="1001" font-size="14" font-weight="400">Calibration, status, event scheduling and recovery</text>
<text x="257" y="1022" font-size="14" font-weight="400">Bulk capture / waveform memory stays on FPGA</text>
<rect x="690" y="910" width="860" height="125" rx="5" fill="#f1f6fa" stroke="#8096a6"/>
<text x="702" y="935" font-size="17" font-weight="600">Shared transport / short queues / GPIO PHY</text>
<text x="702" y="959" font-size="14" font-weight="400">RF I/Q or wired words ↔ packing / gearbox ↔ bounded CDC / elasticity ↔ DDR capture / launch</text>
<text x="702" y="980" font-size="14" font-weight="400">No packet-sized storage promise; sustained pacing, underrun and reset epochs must close</text>
<text x="702" y="1001" font-size="14" font-weight="400">D2H clock owned by active chip path; H2D clock supplied by FPGA</text>
<text x="702" y="1022" font-size="14" font-weight="400">Wired line-rate sampling stays dedicated; RF converters are not serial-lane samplers</text>
<polyline points="655,970 690,970" fill="none" stroke="#355269" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>
<rect x="245" y="1060" width="410" height="75" rx="5" fill="#fff6df" stroke="#8096a6"/>
<text x="257" y="1085" font-size="17" font-weight="600">SPI (4) + RESET_N (1)</text>
<text x="257" y="1109" font-size="14" font-weight="400">Independent configuration / recovery</text>
<rect x="720" y="1060" width="370" height="75" rx="5" fill="#fff6df" stroke="#8096a6"/>
<text x="732" y="1085" font-size="17" font-weight="600">H2D[9:0] + H2D_CLK (11)</text>
<text x="732" y="1109" font-size="14" font-weight="400">FPGA → chip, source-synchronous DDR</text>
<rect x="1150" y="1060" width="400" height="75" rx="5" fill="#fff6df" stroke="#8096a6"/>
<text x="1162" y="1085" font-size="17" font-weight="600">D2H[9:0] + D2H_CLK (11)</text>
<text x="1162" y="1109" font-size="14" font-weight="400">Chip → FPGA, source-synchronous DDR</text>
<polyline points="450,1060 450,1035" fill="none" stroke="#355269" stroke-width="2" marker-end="url(#a)" />
<polyline points="900,1060 900,1035" fill="none" stroke="#355269" stroke-width="2" marker-end="url(#a)" />
<polyline points="1350,1035 1350,1060" fill="none" stroke="#355269" stroke-width="2" marker-end="url(#a)" />
<rect x="245" y="1190" width="1305" height="145" rx="5" fill="#eaf3ff" stroke="#8096a6"/>
<text x="257" y="1215" font-size="17" font-weight="600">EXTERNAL FPGA + BOARD • explicitly outside the die budget</text>
<text x="257" y="1239" font-size="14" font-weight="400">FPGA: protocol controllers / PCS / modem / CRC / FEC; fractional-rate resampling and TX FIR interpolation; bulk storage.</text>
<text x="257" y="1260" font-size="14" font-weight="400">RF rate candidate: LO ÷64/128/256/512 samples; LO ÷16 forwarded DDR clock. FPGA pays filter history and causal latency.</text>
<text x="257" y="1281" font-size="14" font-weight="400">Recovery: actual protocol preambles / tracking; selectable filter settings trade clean-signal fidelity against blocker rejection.</text>
<text x="257" y="1302" font-size="14" font-weight="400">Board: clean oscillator / LO, RF preselection / matching, optional PA, power / decoupling; specialized wired support as required.</text>
<polyline points="450,1190 450,1135" fill="none" stroke="#355269" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>
<polyline points="900,1190 900,1135" fill="none" stroke="#355269" stroke-width="2" marker-end="url(#a)" />
<polyline points="1350,1135 1350,1190" fill="none" stroke="#355269" stroke-width="2" marker-end="url(#a)" />
<text x="30" y="1380" font-size="18" font-weight="600">READING THE DIAGRAM</text>
<text x="30" y="1410" font-size="16" font-weight="400">Solid arrows: bundled payload / functional paths. Purple dashed arrows: timing. Local service fanout is named, not individually routed.</text>
<text x="30" y="1440" font-size="16" font-weight="400">8 analog + 1 reference + 22 host + 5 control + 14 supply/return = 50 terminals. No extra LO, loop-filter or analog-monitor pins implied.</text>
<text x="30" y="1470" font-size="16" font-weight="400">Multiple identical dies can supply HDMI/DVI data lanes; forwarded-clock interface and cross-die alignment remain board/FPGA obligations.</text>
<text x="30" y="1500" font-size="16" font-weight="400">Selected architecture ≠ demonstrated performance. Autonomous noise, full RF quality, pad capacitance and supply/package coupling remain open.</text>
<text x="30" y="1530" font-size="16" font-weight="400">Circuit candidate sheets are exploratory detail, not additional required blocks. RF and wired exclusivity saves activity, not fabricated area.</text>
</g></svg>
