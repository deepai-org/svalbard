<text x="55" y="29810" font-size="19" font-weight="400" text-anchor="start" fill="#172a3a">Each die: 50 terminals, one wafer.space slot; RF payload off. FPGA/board owns DDC, HPD, 5 V and optional CEC.</text>
<text x="55" y="29860" font-size="19" font-weight="400" text-anchor="start" fill="#172a3a">720p / 1080p: integer and /1.001 clocks; intermediate x10 rates. Framed GPIO links; no chip protocol IDs.</text>
<text x="55" y="29910" font-size="19" font-weight="400" text-anchor="start" fill="#172a3a">Open gates: DC pad / ESD, x10 clock and word phase, cross-die skew, FIFO / CDC, independent video compliance.</text>
</g></svg>
