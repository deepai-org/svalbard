<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="1750" viewBox="0 28250 2600 1750" role="img" aria-labelledby="title desc"><title id="title">Svalbard circuit-block schematic and approximate placement</title><desc id="desc">Explicit RF I and Q mixer, gain, filter and converter paths; PLL feedback loops; wired equalizer, sampler, CDR and serializer; programmable analog tiles; references and host control. All external terminals are at the perimeter. Intended circuits, not a completed transistor schematic.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4 L0 8" fill="#233e50"/></marker></defs><rect width="2600" height="30000" fill="white"/><g font-family="DejaVu Sans,sans-serif">
<text x="55" y="28380" font-size="30" font-weight="600" text-anchor="start" fill="#172a3a">HDMI / DVI — THREE IDENTICAL SINGLE-LANE DIES</text>
<text x="55" y="28425" font-size="20" font-weight="400" text-anchor="start" fill="#172a3a">Board assembly, not extra lanes on the 1x1 die. Source shown; sink reverses data direction.</text>
