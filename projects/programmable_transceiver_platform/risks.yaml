hysical closure. Pass 29 v2 schedule masks improve host-RX setup slack to -10.0815ns, but recovery worsens to -2.4561ns. Header validation/schedule loading becomes the critical setup path. Buffered area is 0.974386 mm\u00b2, nominal high-profile clock-pin current 19.92mA; all timing remains unqualified. Pass 30 early schedule preloading passed functional checks but regressed aggregate setup slack in the existing area-oriented mapping; the candidate was rejected and pass-29 RTL restored by SHA256. Mapping/buffering sensitivity, reset/enable distribution and timing-driven optimization now require attention before more RTL tweaks. Pass 31 target-only ABC -D3200 yields unchanged results. Enabling ABC buffering/upsize/dnsize with illustrative buf_1/5fF boundaries reduces buffered area to 0.956517 mm\u00b2 and host TX/RX setup failures to -8.0069/-8.2062ns. This diagnostic has no full gate-level equivalence or physical qualification; reset recovery remains failed. Pass 32 SAT proves mapped next-state/output equivalence between target-only and sized/buffered artifacts for matched state, including register clocks/resets; intentional status inversion is rejected. This is not RTL-to-gates, metastability, glitch or physical timing qualification. Pass 34 placed signal-RC estimate worsens high-profile host TX/RX setup to -16.2450/-12.2338ns and adds four electrical violation rows. Uniform nominal Metal3 estimated RC is not routed extraction or a bound; ideal clocks still omit CTS/skew. Legal placement has not solved interconnect timing."
