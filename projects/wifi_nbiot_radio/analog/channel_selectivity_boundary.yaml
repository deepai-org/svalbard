# SPDX-License-Identifier: Apache-2.0
# Product decision record for the first Wi-Fi receiver candidate. This freezes
# an unimplemented architecture requirement, not a component model or receiver
# claim.
schema_version: 1
status: adc_dsp_architecture_selected_not_implemented
owner_boundary: board_or_package_input_before_die_lna
applies_to:
  parent: ip/blocks/analog/wifi_80211b/rf_rx_external_lo_parent
  test: parent_blocker_tb.spice.in
  desired_rf_hz: 2400000000
  aggressor_rf_hz: 2425000000
  desired_input_peak_v: 1.0e-3
  aggressor_input_peak_v: 1.0e-1
  external_lo_hz: 2300000000
  desired_if_hz: 100000000
  aggressor_if_hz: 125000000
observed_unfiltered_parent:
  evidence: full_rc_pex_fixed_two_tone_diagnostic
  pvt_cases: 5
  minimum_aggressor_to_desired_if_ratio_db: 39.872
  interpretation: >-
    The current routed LNA/mixer parent has no meaningful adjacent-channel
    selectivity. This number is a compact-model observation, not a linearity,
    blocker-tolerance, or IEEE 802.11 requirement.
existing_bench_load:
  topology: 1 kohm shunt resistor plus 1 pF shunt capacitor per IF leg
  one_pole_corner_hz: 159154943
  analytic_loss_at_desired_if_db: -1.445
  analytic_loss_at_aggressor_if_db: -2.087
  analytic_relative_aggressor_rejection_db: 0.642
  conclusion: >-
    This load is a termination/observation condition, not a channel filter;
    its ideal one-pole discrimination is far below the observed ~40 dB excess.
architecture_decision:
  selected_path:
    name: real_if_adc_and_digital_channel_filter
    plan: >-
      ip/blocks/analog/wifi_80211b/rf_rx_external_lo_parent/
      adc_dsp_selectivity_plan.json
    current_byte_bound_budget: >-
      The full-RC PEX two-tone parent fits a 0.25 V peak, 12-ENOB, 320 MS/s
      real-IF converter requirement with 2x blocker headroom. A 65 dB digital
      attenuation requirement at 125 MHz leaves at most -25.103 dB of the
      current blocker relative to desired. This is a budget check, not an ADC
      or DSP implementation result.
    reason: >-
      A normal 2.4 GHz Wi-Fi preselector is deliberately wide enough to pass
      the band: for example, Murata LFB2H2G45SG7A158 is specified around
      2450 MHz with a +/-50 MHz bandwidth. It cannot be credited with rejecting
      the 2425 MHz tone while preserving the intended Wi-Fi passband. It still
      remains required later for out-of-band, image, antenna, package and
      matching control.
  rejected_for_this_candidate:
    - >-
      Treating the existing 1 kohm/1 pF differential bench load as a channel
      filter. Its roughly 159 MHz one-pole corner cannot discriminate 100 MHz
      from 125 MHz by tens of dB.
    - >-
      Adding an arbitrary on-die low-order RC IF filter solely to improve the
      two-tone plot. It would not yield a credible 802.11b channel-selectivity
      claim and would hide the actual input-network decision.
  required_path_one:
    name: external_rf_preselector_and_matching_support
    insertion_point: antenna_50ohm -> RF_GATE
    bind: measured_or_vendor_s_parameter_network
    required_evidence:
      - network_reference_impedance_and_ports
      - desired-band insertion_loss_and_return_loss
      - aggressor-band attenuation
      - process_temperature_and_assembly_scope
      - package_and_die_side_deembedding_boundary
      - passivity_and_causality_check_before_transient_or_noise_use
  alternative_path_two:
    name: real_if_adc_dsp_channel_selection
    status: selected_not_implemented
    first_physical_gate:
      name: differential_sampled_input_interface
      status: nmos_only_baseline_physically_closed_and_rejected
      reason: >-
        It is the lowest-risk executable converter boundary. The existing PCIe
        CML window slicer has an extracted 40--150 mV input contract and cannot
        be promoted to a 12-bit converter comparator with an approximately
        122 uV code step.
      declared_boundary:
        differential_full_scale_peak_v: 0.25
        sample_rate_hz: 320000000
        future_converter_load_per_leg_pf: 5
        settling_allocation_lsb: 0.25
      pass_condition: >-
        A layout-extracted PVT screen must bound switch/input-buffer settling,
        hold error, clock feedthrough, and loading at the declared boundary.
        A simple transmission gate is a candidate, not a promised topology.
      failure_action: >-
        Select a bootstrapped or cancellation topology only if the PEX evidence
        identifies a specific limitation; otherwise revisit the receiver
        frequency plan before creating a larger converter project.
      completed_baseline:
        path: ip/blocks/analog/wifi_80211b/rf_if_nmos_sample_switch
        result: rejected
        evidence: nmos_sampling_switch_rejection.json
        conclusion: >-
          The 0-DRC, unique-LVS, 113R/86C PEX NMOS-only baseline completed all
          five corners but reaches 177.891 mV worst aperture/hold error against
          the 30.518 uV allocation. The analogous schematic probe is also
          rejected, so do not tune this topology further.
        next_candidate: matched_transmission_gate_with_complementary_overlap_controlled_clocks
    required_evidence:
      - analog_chain_iip3_compression_and_noise
      - extracted_differential_sampling_interface
      - adc_input_range_noise_and_sampling_plan
      - digital_filter_response_and_fixed_point_error
      - end_to_end_blocker_headroom_and_evm
  acceptance_before_receiver_level_rerun:
    - Implement the declared IF buffer/sampling interface and converter, then bind their exact PEX evidence.
    - Implement the fixed-point digital filter and bind response, quantization, jitter, and group-delay evidence.
    - Re-run desired plus aggressor PEX, noise, linearity, compression, and calibration tests through the actual IF/baseband parent.
    - Bind a later measured/vendor RF preselector/matching network separately; keep its loss/noise and port de-embedding outside on-die PEX.
not_a_claim:
  - implemented_adc_or_dsp
  - selected_external_component
  - ieee80211b_adjacent_channel_rejection
  - receiver_sensitivity
  - qualified_rf_model
